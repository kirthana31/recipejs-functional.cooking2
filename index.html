<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecipeJS - Your Functional Cooking Companion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🍳 RecipeJS</h1>
    <p>Your Functional Cooking Companion</p>
  </header>

  <main>
    <div id="recipe-container">
      <!-- Recipe cards will be rendered here by JavaScript -->
    </div>
  </main>
  <div id="filters">
  <button data-filter="ALL">All Recipes</button>
  <button data-filter="EASY">Easy</button>
  <button data-filter="MEDIUM">Medium</button>
  <button data-filter="HARD">Hard</button>
  <button data-filter="QUICK">Quick (Under 30 mins)</button>
</div>

<div id="sort">
  <button data-sort="NAME">Name (A–Z)</button>
  <button data-sort="TIME">Time (Fastest First)</button>
</div>

<div id="recipe-list"></div>


  <script src="app.js"></script>
</body>
</html>
